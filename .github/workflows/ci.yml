name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make verify
      # La APK no se compila en CI (requiere el SDK de Android): se hace en local con `make apk`.
      - run: npm run build:web
      - run: npm run build:artesano
